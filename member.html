<!DOCTYPE html>
<html lang="th">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030303;
            --panel-bg: rgba(14, 14, 14, 0.75);
            --panel-border: rgba(255, 255, 255, 0.07);
            --gold: #FFD700;
            --red: #FF3333;
            --blue: #3399FF;
            --green: #33CC33;
            --hud-cyan: #00f3ff;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh; width: 100vw;
            font-family: 'Inter', sans-serif; background-color: var(--bg-deep); color: #ffffff;
            overflow-x: hidden; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
        }

        #bg-image {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover; background-position: center;
            z-index: 0; animation: bgZoom 35s ease-in-out infinite alternate;
        }
        @keyframes bgZoom { 0% { transform: scale(1); } 100% { transform: scale(1.12); } }

        .bg-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88); z-index: 1; pointer-events: none; transition: background 0.5s ease;
        }

        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none;
        }

        .container {
            position: relative; z-index: 3; max-width: 1250px; margin: 0 auto; padding: 50px 20px 130px;
            width: 100%; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; align-items: center;
        }

        .top-nav { display: flex; justify-content: center; align-items: center; width: 100%; position: relative; margin-bottom: 45px; }

        .btn-back {
            position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            text-decoration: none; color: #ccc; font-weight: 600; font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase;
            padding: 12px 24px; border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); display: flex; align-items: center; gap: 8px;
        }
        .btn-back:hover { 
            background: rgba(40, 40, 40, 0.85); color: #fff; border-color: rgba(255,255,255,0.4); 
            box-shadow: 0 0 25px rgba(255,255,255,0.25); transform: translateY(-50%) translateY(-2px);
        }

        .header-title-box { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .page-title {
            font-family: 'Oswald', sans-serif; font-size: clamp(2.2rem, 5vw, 3.5rem); letter-spacing: 0.25em; margin: 0;
            font-weight: 700; text-transform: uppercase; color: #fff; text-shadow: 0 0 35px rgba(255, 255, 255, 0.25);
            background: linear-gradient(180deg, #ffffff 0%, #999999 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .page-subtitle { font-size: 0.7rem; color: #777; letter-spacing: 0.5em; margin-top: 8px; text-transform: uppercase; font-weight: 500; }

        .search-container { width: 100%; margin-bottom: 50px; display: flex; justify-content: center; }
        .search-box { width: 100%; max-width: 580px; position: relative; display: flex; align-items: center; }
        .search-icon { position: absolute; left: 24px; width: 16px; height: 16px; fill: #666; pointer-events: none; transition: fill 0.3s ease; }
        .search-box input {
            width: 100%; padding: 18px 20px 18px 54px; box-sizing: border-box;
            background: rgba(12, 12, 12, 0.75); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; color: #fff;
            font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 500; outline: none; backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.6); letter-spacing: 0.15em; text-transform: uppercase;
        }
        .search-box input::placeholder { color: #555; font-weight: 400; text-transform: uppercase; letter-spacing: 0.2em; }
        .search-box input:hover { border-color: rgba(255,255,255,0.2); background: rgba(18, 18, 18, 0.85); }
        .search-box input:focus {
            background: rgba(22, 22, 22, 0.95); border-color: rgba(255,255,255,0.4);
            box-shadow: 0 15px 45px rgba(0,0,0,0.8), 0 0 25px rgba(255,255,255,0.12); transform: translateY(-2px);
        }
        .search-box input:focus::placeholder { color: #888; }
        .search-box input:focus ~ .search-icon { fill: #fff; }

        .category-section { width: 100%; margin-bottom: 50px; display: none; }
        .category-section.has-data { display: block; }

        .category-title {
            font-family: 'Oswald', sans-serif; font-size: 1.4rem; letter-spacing: 0.25em; margin-bottom: 25px;
            text-transform: uppercase; font-weight: 700; display: flex; align-items: center; gap: 12px;
        }
        .category-title::before { content: ''; display: inline-block; width: 4px; height: 22px; border-radius: 2px; }
        .title-owner::before { background-color: var(--gold); box-shadow: 0 0 12px var(--gold); }
        .title-leader::before { background-color: var(--red); box-shadow: 0 0 12px var(--red); }
        .title-support::before { background-color: var(--blue); box-shadow: 0 0 12px var(--blue); }
        .title-member::before { background-color: var(--green); box-shadow: 0 0 12px var(--green); }
        .cat-count { font-size: 0.8rem; color: #555; font-weight: 400; margin-left: 5px; }

        .member-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px; justify-content: center; width: 100%;
        }

        .smooth-fade { animation: smoothFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes smoothFadeIn { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }

        .member-card {
            background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--panel-border);
            border-radius: 16px; padding: 16px 20px; display: flex; align-items: center; gap: 16px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; overflow: hidden;
        }
        .card-owner:hover { transform: translateY(-4px); background: rgba(255, 215, 0, 0.06); border-color: rgba(255, 215, 0, 0.4); box-shadow: 0 12px 35px rgba(255, 215, 0, 0.15); }
        .card-leader:hover { transform: translateY(-4px); background: rgba(255, 51, 51, 0.06); border-color: rgba(255, 51, 51, 0.4); box-shadow: 0 12px 35px rgba(255, 51, 51, 0.15); }
        .card-support:hover { transform: translateY(-4px); background: rgba(51, 153, 255, 0.06); border-color: rgba(51, 153, 255, 0.4); box-shadow: 0 12px 35px rgba(51, 153, 255, 0.15); }
        .card-member:hover { transform: translateY(-4px); background: rgba(51, 204, 51, 0.06); border-color: rgba(51, 204, 51, 0.4); box-shadow: 0 12px 35px rgba(51, 204, 51, 0.15); }

        .avatar-container { position: relative; flex-shrink: 0; }
        .member-avatar {

        .btn-leader { background: var(--red); color: #fff; box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3); }
        .btn-leader:hover { background: #fff; color: #000; box-shadow: 0 4px 20px rgba(255,255,255,0.7); }
        .btn-support { background: var(--blue); color: #fff; box-shadow: 0 4px 15px rgba(51, 153, 255, 0.3); }
        .btn-support:hover { background: #fff; color: #000; box-shadow: 0 4px 20px rgba(255,255,255,0.7); }
        .btn-member { background: var(--green); color: #000; box-shadow: 0 4px 15px rgba(51, 204, 51, 0.3); }

        .page-btn {
            background: rgba(15, 15, 15, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); color: #aaa; width: 46px; height: 46px; border-radius: 12px;

        .page-btn.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 0 25px rgba(255, 215, 0, 0.5); font-weight: 700; }
        .page-arrow {
            background: rgba(15, 15, 15, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); color: var(--gold); width: 46px; height: 46px; border-radius: 12px;

        }

        .page-arrow:disabled { opacity: 0.25; cursor: not-allowed; color: #555; }

        .no-results { text-align: center; color: #666; padding: 40px; font-weight: 300; font-size: 0.9rem; letter-spacing: 0.1em; display: none; text-transform: uppercase; }

        .music-widget {

        .music-widget.collapsed { height: 66px; }
        .music-widget.expanded { height: 125px; }

        .music-header { display: flex; align-items: center; padding: 10px 14px; height: 66px; box-sizing: border-box; cursor: pointer; position: relative; }
        .cover-wrapper { position: relative; width: 42px; height: 42px; margin-right: 12px; flex-shrink: 0; }
        .music-cover {

        }
        .playing .music-cover { animation-play-state: running; border-color: #00f3ff; }
        .cover-glow {
            position: absolute; inset: -3px; border-radius: 50%; background: linear-gradient(45deg, #00f3ff, transparent, #ff0055);
            opacity: 0; transition: opacity 0.3s; z-index: -1; filter: blur(4px);
        }
        .playing .cover-glow { opacity: 0.8; animation: pulseGlow 2s infinite alternate; }
        @keyframes spinRecord { 100% { transform: rotate(360deg); } }
        @keyframes pulseGlow { 0% { opacity: 0.4; } 100% { opacity: 0.9; } }

        .music-info-mini { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .music-label { font-size: 0.45rem; color: #00f3ff; letter-spacing: 0.25em; font-weight: 700; text-shadow: 0 0 8px rgba(0,243,255,0.5); }
        .music-title {
            font-family: 'Oswald', sans-serif; font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; color: #fff; margin-top: 2px; letter-spacing: 0.05em;
        }
        .music-link { font-size: 0.48rem; color: #888; text-decoration: none; letter-spacing: 0.15em; margin-top: 1px; transition: color 0.3s; font-weight: 600; }
        .music-link:hover { color: #00f3ff; text-shadow: 0 0 5px #00f3ff; }
        .toggle-icon { font-size: 0.6rem; color: #00f3ff; padding: 5px; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        .music-controls {
            display: flex; align-items: center; padding: 0 16px 14px 16px; gap: 14px; opacity: 0; transition: opacity 0.4s ease 0.1s;
            border-top: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.3);
        }
        .music-widget.expanded .music-controls { opacity: 1; }

        .ctrl-btn {
            background: rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.3); color: #00f3ff; width: 32px; height: 32px;
            border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
        }
        .ctrl-btn:hover { background: #00f3ff; color: #000; transform: scale(1.08); box-shadow: 0 0 20px rgba(0, 243, 255, 0.6); }

        .vol-wrapper { flex: 1; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.03); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); }
        .vol-icon { font-size: 0.5rem; color: #aaa; letter-spacing: 0.1em; font-weight: 700; }
        .vol-slider { flex: 1; -webkit-appearance: none; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; cursor: pointer; }
        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 10px; height: 10px; border-radius: 3px; background: #00f3ff; cursor: pointer; box-shadow: 0 0 8px #00f3ff; transition: transform 0.2s;
        }
        .vol-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }

        @keyframes fadeUpIn { 0% { opacity: 0; transform: translateY(30px); filter: blur(5px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .anim-item { opacity: 0; animation: fadeUpIn 1.2s forwards cubic-bezier(0.16, 1, 0.3, 1); }
        .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; } .delay-3 { animation-delay: 0.3s; } .delay-4 { animation-delay: 0.4s; }
        
        .footer-credit {
            position: relative; z-index: 3; width: 100%; text-align: center; padding: 18px 0 22px; font-size: 0.55rem; color: #555;
            letter-spacing: 0.3em; text-transform: uppercase; font-weight: 300; border-top: 1px solid rgba(255, 255, 255, 0.03); margin-top: auto; 
        }

        @media (max-width: 768px) {
            .page-title { font-size: 1.8rem; }
            .btn-back { position: static; transform: none; margin-bottom: 20px; padding: 10px 18px; font-size: 0.65rem; }
            .top-nav { flex-direction: column; }
            .music-widget { bottom: 15px; right: 15px; width: 240px; }
            .member-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2; this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() * -0.5) - 0.1; this.opacity = Math.random() * 0.5;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 8000;
            for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
            requestAnimationFrame(animateParticles);
        }
        initParticles(); animateParticles();

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        let isPlaying = false; audio.volume = 0.5;

        const savedTime = sessionStorage.getItem('musicCurrentTime');
        const wasPlaying = sessionStorage.getItem('musicIsPlaying');
        
        if (savedTime) audio.currentTime = parseFloat(savedTime);
        if (wasPlaying === 'true') {
            audio.play().then(() => { 
                playPauseBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; 
                musicWidget.classList.add('playing'); isPlaying = true; 
            }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider')) {
                audio.play().then(() => {
                    playPauseBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                    musicWidget.classList.add('playing'); isPlaying = true;
                    sessionStorage.setItem('musicIsPlaying', 'true');
                }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { 
                audio.pause(); playPauseBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; musicWidget.classList.remove('playing');
                sessionStorage.setItem('musicIsPlaying', 'false');
            } else { 
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; musicWidget.classList.add('playing'); 
                    sessionStorage.setItem('musicIsPlaying', 'true');
                }).catch(e=>{}); 
            }
            isPlaying = !isPlaying;
        });
        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if(e.target.tagName.toLowerCase() === 'a') return;
            if (musicWidget.classList.contains('collapsed')) {
                musicWidget.classList.replace('collapsed', 'expanded'); toggleIcon.style.transform = 'rotate(180deg)';
            } else {
                musicWidget.classList.replace('expanded', 'collapsed'); toggleIcon.style.transform = 'rotate(0deg)';
            }
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAMC27A972IEnrXG2-kWCOTKJZLRM7Adaw", authDomain: "eltiestylecustom.firebaseapp.com", projectId: "eltiestylecustom", storageBucket: "eltiestylecustom.firebasestorage.app", messagingSenderId: "763447692670", appId: "1:763447692670:web:687333af7f0e3f253db72f" };

        const categoriesConfig = [
            { id: 'cat-owner', name: 'THE BOSSS', classPrefix: 'owner', titleClass: 'title-owner', roleKey: 'THE BOSSS' },
            { id: 'cat-leader', name: 'LEADERS', classPrefix: 'leader', titleClass: 'title-leader', roleKey: 'LEADERS' },
            { id: 'cat-support', name: 'SUPPORT', classPrefix: 'support', titleClass: 'title-support', roleKey: 'SUPPORT' },
            { id: 'cat-member', name: 'MEMBERS', classPrefix: 'member', titleClass: 'title-member', roleKey: 'MEMBERS' }
        ];

        let membersData = [];
        let globalDefaultAvatar = 'https://placehold.co/150/222/777?text=U';

        const container = document.getElementById('categoryContainer');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');
        const paginationContainer = document.getElementById('paginationContainer');

        let currentPage = 1;
        const membersPerPage = 12;

        function initCategoryContainers() {
            container.innerHTML = '';
            categoriesConfig.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'category-section smooth-fade';
                section.id = `section-${cat.classPrefix}`;
                
                const totalCount = membersData.filter(m => m.role.toLowerCase() === cat.roleKey.toLowerCase()).length;

                section.innerHTML = `
                    <h2 class="category-title ${cat.titleClass}">${cat.name} <span class="cat-count">/ ${totalCount}</span></h2>
                    <div class="member-grid" id="grid-${cat.classPrefix}"></div>
                `;
                container.appendChild(section);
            });
        }

        function renderMembers(dataToRender, searchTerm = "") {
            categoriesConfig.forEach(cat => {
                document.getElementById(`grid-${cat.classPrefix}`).innerHTML = '';
                document.getElementById(`section-${cat.classPrefix}`).classList.remove('has-data');
            });

            const filteredData = dataToRender.filter(member => 
                member.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            noResults.style.display = filteredData.length === 0 ? 'block' : 'none';

            const owners = filteredData.filter(m => m.role.toUpperCase() === 'THE BOSSS');
            const leaders = filteredData.filter(m => m.role.toUpperCase() === 'LEADERS');
            const supports = filteredData.filter(m => m.role.toUpperCase() === 'SUPPORT');
            const allMembersList = filteredData.filter(m => m.role.toUpperCase() === 'MEMBERS');

            const totalMemberPages = Math.ceil(allMembersList.length / membersPerPage) || 1;
            if (currentPage > totalMemberPages) currentPage = totalMemberPages;

            const startIndex = (currentPage - 1) * membersPerPage;
            const endIndex = startIndex + membersPerPage;
            const paginatedMembers = allMembersList.slice(startIndex, endIndex);

            const renderGroup = (list, classPrefix) => {
                if (list.length > 0) {
                    const grid = document.getElementById(`grid-${classPrefix}`);
                    const section = document.getElementById(`section-${classPrefix}`);
                    
                    list.forEach(member => {
                        const card = document.createElement('div');
                        card.className = `member-card card-${classPrefix} smooth-fade`;
                        
                        const avatarUrl = (member.avatar && member.avatar.trim() !== "") ? member.avatar : globalDefaultAvatar;
                        
                        card.innerHTML = `
                            <div class="avatar-container">
                                <img src="${avatarUrl}" class="member-avatar" alt="${member.name}">
                                <div class="status-dot"></div>
                            </div>
                            <div class="member-info">
                                <p class="member-role role-${classPrefix}">${member.role}</p>
                                <h3 class="member-name" title="${member.name}">${member.name}</h3>
                            </div>
                            <a href="${member.facebookUrl || '#'}" target="_blank" class="fb-btn btn-${classPrefix}">
                                <svg class="fb-icon" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                                PROFILE
                            </a>
                        `;
                        grid.appendChild(card);
                    });
                    section.classList.add('has-data');
                }
            };

            renderGroup(owners, 'owner');
            renderGroup(leaders, 'leader');
            renderGroup(supports, 'support');
            renderGroup(paginatedMembers, 'member');

            renderPagination(totalMemberPages);
        }

        function renderPagination(totalPages) {
            paginationContainer.innerHTML = '';
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-arrow';
            prevBtn.innerHTML = '❮';
            prevBtn.disabled = currentPage === 1;
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) { currentPage--; renderMembers(membersData, searchInput.value); }
            });
            paginationContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.innerText = i;
                pageBtn.addEventListener('click', () => {
                    currentPage = i; renderMembers(membersData, searchInput.value);
                });
                paginationContainer.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-arrow';
            nextBtn.innerHTML = '❯';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) { currentPage++; renderMembers(membersData, searchInput.value); }
            });
            paginationContainer.appendChild(nextBtn);
        }

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);

            onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
                if (docSnap.exists()) {
                    const config = docSnap.data();
                    if (config.bgUrl) document.getElementById('bg-image').style.backgroundImage = `url('${config.bgUrl}')`;
                    if (config.faviconUrl) {
                        const favEl = document.getElementById('siteFavicon');
                        if (favEl) favEl.href = config.faviconUrl;
                    }
                    if (config.memberTitle) document.getElementById('dynMemberTitle').innerText = config.memberTitle;
                    if (config.memberSubTitle) document.getElementById('dynMemberSubTitle').innerText = config.memberSubTitle;
                    if (config.bgOpacity) {
                        document.querySelector('.bg-overlay').style.backgroundColor = `rgba(0, 0, 0, ${config.bgOpacity})`;
                    }
                    if (config.defaultAvatar) {
                        globalDefaultAvatar = config.defaultAvatar;
                    }
                    if(config.musicTitle) document.getElementById('musicTitle').innerText = config.musicTitle;
                    if(config.musicLinkText) document.getElementById('musicLink').innerText = config.musicLinkText;
                    if(config.musicLinkUrl) document.getElementById('musicLink').href = config.musicLinkUrl;
                    if(config.musicCoverUrl) document.getElementById('musicCover').src = config.musicCoverUrl;
                }
            });

            onSnapshot(collection(db, "members"), (snapshot) => {
                let firebaseMembers = [];
                snapshot.forEach(doc => { firebaseMembers.push({ id: doc.id, ...doc.data() }); });
                membersData = firebaseMembers; 
                initCategoryContainers();
                renderMembers(membersData, searchInput.value);
            }, (error) => {
                console.warn("Using sample data for now.");
            });

        } catch (error) {
            console.error("Firebase Init Error:", error);
        }
    </script>
</body>
