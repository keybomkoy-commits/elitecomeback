<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING ELITE</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="elite.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'bebas': ['"Bebas Neue"', 'sans-serif'],
                        'inter': ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        'brand-cream': '#f4f1ea',
                        'brand-gold': '#a38751',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020203;
            color: #ffffff;
            overflow: hidden;
            /* ย้ายพื้นหลังและอนิเมชันไปใส่ในคลาสของวิดีโอแทน */
        }

        /* ตั้งค่าวิดีโอพื้นหลัง */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
            animation: bgZoom 25s ease-in-out infinite alternate;
        }

        /* แผ่นฟิลเตอร์สีดำทับวิดีโอ (คง gradient เดิมไว้) */
        .video-overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.88));
            z-index: -1;
            pointer-events: none;
        }

        @keyframes bgZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 40;
            opacity: 0.15; 
        }

        .winter-particle {
            position: fixed;
            top: -40px;
            object-fit: contain;
            pointer-events: none;
            z-index: 1;
            animation: fallWinter linear infinite;
        }

        @keyframes fallWinter {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            15% { opacity: 0.8; }
            85% { opacity: 0.5; }
            100% { transform: translateY(105vh) translateX(var(--winter-drift)) rotate(360deg); opacity: 0; }
        }

        @keyframes slideUpHeavy {
            0% { transform: translateY(80px) scale(0.95); opacity: 0; filter: blur(10px); }
            100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
        }

        @keyframes slideInRight {
            0% { transform: translateX(-40px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .anim-slide-up {
            animation: slideUpHeavy 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .anim-slide-right {
            animation: slideInRight 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-100 { animation-delay: 0.1s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-500 { animation-delay: 0.5s; }
        .delay-700 { animation-delay: 0.7s; }
        .delay-900 { animation-delay: 0.9s; }

        main { position: relative; z-index: 10; }
    </style>
</head>
<body class="h-screen w-full font-inter flex items-center justify-center overflow-hidden">

    <!-- เพิ่มวิดีโอพื้นหลังที่นี่ -->
    <video autoplay loop muted playsinline class="bg-video">
        <source src="bg.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="scanlines"></div>
    <div id="winterContainer" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <div class="fixed top-6 left-0 w-full flex justify-center z-50 px-4">
        <nav class="w-full max-w-7xl bg-black/60 backdrop-blur-md border border-brand-gold/30 rounded-lg flex justify-between items-center px-5 md:px-8 py-3 shadow-[0_15px_30px_rgba(0,0,0,0.8)] anim-slide-up">
            
            <div class="flex items-center gap-3 shrink-0">
                <i class="fa-solid fa-crown text-brand-gold text-lg drop-shadow-[0_0_8px_rgba(163,135,81,0.5)]"></i>
                <span class="text-brand-cream font-bebas text-2xl tracking-[0.15em] mt-1">KING ELITE</span>
            </div>
            
            <div class="flex items-center gap-5 md:gap-8">
                <a href="#" class="relative text-brand-gold text-[11px] md:text-xs font-bold tracking-[0.2em] transition-colors hover:text-white py-1">
                    HOME
                    <span class="absolute bottom-0 left-0 w-full h-[2px] bg-brand-gold shadow-[0_0_8px_#a38751]"></span>
                </a>
                
                <a href="member.html" class="text-gray-500 hover:text-brand-cream transition-colors text-[11px] md:text-xs font-bold tracking-[0.2em] hidden sm:block py-1">
                    MEMBERS
                </a>
                
                <div class="flex items-center gap-2 border border-brand-gold/20 bg-[#0a0a0a] px-3 py-1.5 rounded-sm shrink-0 ml-2 shadow-[inset_0_0_10px_rgba(0,0,0,0.5)]">
                    <span class="w-2 h-2 rounded-full bg-[#22c55e] shadow-[0_0_8px_#22c55e] animate-pulse"></span>
                    <span class="text-[10px] md:text-[11px] font-bold text-gray-300 tracking-wider mt-[1px]">ONLINE</span>
                </div>
            </div>
            
        </nav>
    </div>

    <!-- เครื่องเล่นเพลงลอยฟ้า -->
    <div class="fixed bottom-6 right-6 z-50 flex items-center gap-3 bg-black/80 border border-brand-gold/40 px-4 py-2.5 rounded-xl backdrop-blur-md shadow-[0_10px_25px_rgba(0,0,0,0.9)]">
        <button id="musicToggleBtn" class="w-8 h-8 rounded-lg bg-brand-gold/20 text-brand-gold flex items-center justify-center hover:bg-brand-gold hover:text-black transition-all">
            <i id="musicIcon" class="fa-solid fa-volume-high text-xs"></i>
        </button>
        <div class="flex flex-col">
            <span class="text-[10px] font-bold text-brand-gold tracking-widest uppercase">Hail to the King</span>
            <div class="flex items-center gap-2 mt-0.5">
                <input type="range" id="volumeSlider" min="0" max="100" value="20" class="w-20 accent-[#a38751] h-1 bg-gray-800 rounded-lg cursor-pointer">
                <span id="volumeText" class="text-[9px] text-gray-400 font-mono">20%</span>
            </div>
        </div>
        <a href="https://youtu.be/MjwttGizNEs?si=WnlCDz0JU9Y1Gp9P" target="_blank" title="เพลงต้นฉบับ" class="ml-1 w-7 h-7 rounded-lg bg-white/5 text-gray-400 hover:text-white flex items-center justify-center transition-all border border-white/10">
            <i class="fa-solid fa-link text-[10px]"></i>
        </a>
    </div>

    <main class="w-full max-w-7xl px-10 flex flex-col md:flex-row items-center justify-between gap-20">
        
        <div class="flex-1 flex flex-col justify-center mt-16 md:mt-0">
            <div class="flex items-center gap-4 mb-2 pl-2 anim-slide-right delay-100">
                <div class="w-12 h-[3px] bg-brand-gold"></div>
                <p class="text-sm tracking-[0.4em] text-brand-gold uppercase font-bold drop-shadow-md">House of 9841s</p>
            </div>
            
            <h1 class="font-bebas text-[140px] md:text-[180px] leading-[0.85] tracking-wide text-brand-cream anim-slide-up delay-300 drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] hover:scale-105 hover:text-white transition-all duration-700 cursor-default">
                ELITES
            </h1>
            
            <p class="text-xs md:text-sm tracking-[0.6em] text-gray-400 uppercase mt-4 pl-2 font-semibold anim-slide-right delay-500">
                3 YEAR
            </p>

            <div class="flex gap-8 md:gap-16 text-brand-cream mt-12 pl-2">
                <div class="anim-slide-right delay-700">
                    <h3 class="font-bebas text-4xl md:text-5xl text-white mb-1 drop-shadow-lg">GMP</h3>
                    <p class="text-[9px] md:text-[10px] tracking-widest text-gray-400 uppercase font-bold">GUMAIPAE</p>
                </div>
                <div class="anim-slide-right delay-700" style="animation-delay: 0.8s;">
                    <h3 class="font-bebas text-4xl md:text-5xl text-white mb-1 drop-shadow-lg">PMF</h3>
                    <p class="text-[9px] md:text-[10px] tracking-widest text-gray-400 uppercase font-bold">PHUMAIFAIR</p>
                </div>
                <div class="anim-slide-right delay-700" style="animation-delay: 0.9s;">
                    <h3 class="font-bebas text-4xl md:text-5xl text-brand-gold mb-1 drop-shadow-[0_0_15px_rgba(163,135,81,0.5)]">2026</h3>
                    <p class="text-[9px] md:text-[10px] tracking-widest text-gray-400 uppercase font-bold">WE ARE RUNNING</p>
                </div>
            </div>
        </div>

        <div class="w-full max-w-sm flex flex-col justify-center anim-slide-up delay-900 mt-10 md:mt-0">
            <p class="text-xs tracking-[0.3em] text-gray-500 uppercase mb-6 font-bold border-b border-gray-800/80 pb-3 text-center">
                Enter the Gang
            </p>
            
            <a href="member.html" class="group relative w-full border-2 border-brand-gold/80 bg-black/60 backdrop-blur-md py-4 px-6 rounded-xl overflow-hidden transition-all duration-500 hover:-translate-y-1 hover:shadow-[0_8px_20px_rgba(163,135,81,0.2)]">
                <div class="absolute inset-0 bg-brand-gold translate-x-[-101%] group-hover:translate-x-0 transition-transform duration-500 ease-out z-0"></div>
                <div class="relative z-10 flex justify-between items-center px-2">
                    <span class="text-sm tracking-[0.2em] text-brand-gold group-hover:text-black font-extrabold uppercase transition-colors duration-300">
                        Elitestyle Gang
                    </span>
                    <i class="fa-solid fa-arrow-right text-lg text-brand-gold group-hover:text-black transition-colors duration-300 drop-shadow-md"></i>
                </div>
            </a>
        </div>
    </main>

    <!-- ระบบจัดการเพลง -->
    <script>
        const winterContainer = document.getElementById('winterContainer');
        const winterCount = 18;
        for (let i = 0; i < winterCount; i++) {
            let item = document.createElement('img');
            item.src = 'winter.png';
            item.classList.add('winter-particle');
            let size = Math.random() * 20 + 20;
            item.style.width = size + 'px';
            item.style.left = Math.random() * 100 + 'vw';
            let duration = Math.random() * 12 + 8;
            item.style.animationDuration = duration + 's';
            let delay = Math.random() * 10;
            item.style.animationDelay = delay + 's';
            let drift = (Math.random() - 0.5) * 120 + 'px';
            item.style.setProperty('--winter-drift', drift);
            let opacity = Math.random() * 0.5 + 0.3;
            item.style.opacity = opacity;
            winterContainer.appendChild(item);
        }

        let savedTime = sessionStorage.getItem('elite_music_time');
        let savedVol = sessionStorage.getItem('elite_music_vol');
        let targetVol = savedVol !== null ? parseFloat(savedVol) : 0.2;

        let bgMusic = new Audio('music.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0; 
        if (savedTime) bgMusic.currentTime = parseFloat(savedTime);

        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeText = document.getElementById('volumeText');

        volumeSlider.value = targetVol * 100;
        volumeText.textContent = Math.round(targetVol * 100) + '%';

        let isUserInteracted = false;

        function startAudioPlayback() {
            if (isUserInteracted) return;
            isUserInteracted = true;

            bgMusic.play().then(() => {
                let currentFadeVol = 0;
                let fadeInterval = setInterval(() => {
                    currentFadeVol += 0.01;
                    if (currentFadeVol >= targetVol) {
                        bgMusic.volume = targetVol;
                        clearInterval(fadeInterval);
                    } else {
                        bgMusic.volume = currentFadeVol;
                    }
                }, 40);

                musicIcon.className = "fa-solid fa-volume-high text-xs";
                sessionStorage.setItem('elite_music_playing', 'true');
            }).catch(err => {
                console.log("Autoplay prevented:", err);
                isUserInteracted = false;
            });
        }

        window.addEventListener('click', startAudioPlayback, { once: true });
        window.addEventListener('keydown', startAudioPlayback, { once: true });

        musicToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (bgMusic.paused) {
                bgMusic.play();
                bgMusic.volume = targetVol;
                musicIcon.className = "fa-solid fa-volume-high text-xs";
                sessionStorage.setItem('elite_music_playing', 'true');
            } else {
                bgMusic.pause();
                musicIcon.className = "fa-solid fa-volume-xmark text-xs";
                sessionStorage.setItem('elite_music_playing', 'false');
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            e.stopPropagation();
            let val = e.target.value;
            targetVol = val / 100;
            bgMusic.volume = targetVol;
            sessionStorage.setItem('elite_music_vol', targetVol);
            volumeText.textContent = val + '%';
            if (targetVol > 0 && bgMusic.paused) {
                bgMusic.play();
            }
            if (targetVol == 0) {
                musicIcon.className = "fa-solid fa-volume-xmark text-xs";
            } else {
                musicIcon.className = "fa-solid fa-volume-high text-xs";
            }
        });

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('elite_music_time', bgMusic.currentTime);
            sessionStorage.setItem('elite_music_vol', bgMusic.volume);
        });
    </script>
</body>
</html>
