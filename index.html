<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING ELITE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'bebas': ['"Bebas Neue"', 'sans-serif'],
                        'inter': ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        'brand-cream': '#f4f1ea',
                        'brand-gold': '#a38751',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020203;
            background-image: linear-gradient(rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.88)), url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            overflow: hidden;
            animation: bgZoom 25s ease-in-out infinite alternate;
        }

        @keyframes bgZoom {
            0% { background-size: 100% 100%; }
            100% { background-size: 108% 108%; }
        }

        /* Scanlines Effect */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 40;
            opacity: 0.15; 
        }

        /* --------------------------------- */
        /* เอฟเฟกต์รูป winter.png โปรยปรายสมูทๆ */
        /* --------------------------------- */
        .winter-particle {
            position: fixed;
            top: -40px;
            object-fit: contain;
            pointer-events: none;
            z-index: 1;
            animation: fallWinter linear infinite;
        }

        @keyframes fallWinter {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.8;
            }
            85% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(105vh) translateX(var(--winter-drift)) rotate(360deg);
                opacity: 0;
            }
        }

        /* Custom Animations */
        @keyframes slideUpHeavy {
            0% { transform: translateY(80px) scale(0.95); opacity: 0; filter: blur(10px); }
            100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
        }

        @keyframes slideInRight {
            0% { transform: translateX(-40px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes thickPulse {
            0%, 100% { 
                box-shadow: 0 0 15px rgba(163,135,81,0.2), inset 0 0 10px rgba(163,135,81,0.1); 
                border-color: rgba(163,135,81, 0.5);
            }
            50% { 
                box-shadow: 0 0 40px rgba(163,135,81,0.6), inset 0 0 20px rgba(163,135,81,0.3); 
                border-color: rgba(163,135,81, 1);
                text-shadow: 0 0 15px rgba(163,135,81, 0.8);
            }
        }

        .anim-slide-up {
            animation: slideUpHeavy 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .anim-slide-right {
            animation: slideInRight 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .anim-pulse-button {
            animation: thickPulse 2.5s infinite;
        }

        .delay-100 { animation-delay: 0.1s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-500 { animation-delay: 0.5s; }
        .delay-700 { animation-delay: 0.7s; }
        .delay-900 { animation-delay: 0.9s; }

        main { position: relative; z-index: 10; }
    </style>
</head>
<body class="h-screen w-full font-inter flex items-center justify-center overflow-hidden">

    <div class="scanlines"></div>
    <div id="winterContainer" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <main class="w-full max-w-7xl px-10 flex flex-col md:flex-row items-center justify-between gap-20">
        
        <!-- ฝั่งซ้าย: ตัวอักษร (Typography) -->
        <div class="flex-1 flex flex-col justify-center">
            
            <div class="flex items-center gap-4 mb-2 pl-2 anim-slide-right delay-100">
                <div class="w-12 h-[3px] bg-brand-gold"></div>
                <p class="text-sm tracking-[0.4em] text-brand-gold uppercase font-bold drop-shadow-md">House of 9841s</p>
            </div>
            
            <h1 class="font-bebas text-[180px] leading-[0.85] tracking-wide text-brand-cream anim-slide-up delay-300 drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] hover:scale-105 hover:text-white transition-all duration-700 cursor-default">
                ELITES
            </h1>
            
            <p class="text-sm tracking-[0.6em] text-gray-400 uppercase mt-4 pl-2 font-semibold anim-slide-right delay-500">
                3 YEAR
            </p>

            <div class="flex gap-16 text-brand-cream mt-12 pl-2">
                <div class="anim-slide-right delay-700">
                    <h3 class="font-bebas text-5xl text-white mb-1 drop-shadow-lg">GMP</h3>
                    <p class="text-[10px] tracking-widest text-gray-400 uppercase font-bold">GUMAIPAE</p>
                </div>
                <div class="anim-slide-right delay-700" style="animation-delay: 0.8s;">
                    <h3 class="font-bebas text-5xl text-white mb-1 drop-shadow-lg">PMF</h3>
                    <p class="text-[10px] tracking-widest text-gray-400 uppercase font-bold">PHUMAIFAIR</p>
                </div>
                <div class="anim-slide-right delay-700" style="animation-delay: 0.9s;">
                    <h3 class="font-bebas text-5xl text-brand-gold mb-1 drop-shadow-[0_0_15px_rgba(163,135,81,0.5)]">2026</h3>
                    <p class="text-[10px] tracking-widest text-gray-400 uppercase font-bold">WE ARE RUNNING</p>
                </div>
            </div>
        </div>

        <!-- ฝั่งขวา: ปุ่ม UFBZC GANG -->
        <div class="w-full max-w-md flex flex-col justify-center anim-slide-up delay-900">
            
            <p class="text-sm tracking-[0.3em] text-gray-400 uppercase mb-8 font-bold border-b-2 border-gray-800 pb-3 text-center">
                Enter the Gang
            </p>
            
            <!-- ปุ่มกดลิงก์ไปหน้า member.html พร้อมอนิเมชั่นสมูท -->
            <a href="member.html" class="group relative w-full border-4 border-brand-gold bg-black/40 backdrop-blur-md py-7 px-10 overflow-hidden transition-all duration-500 anim-pulse-button hover:-translate-y-2 hover:scale-105">
                
                <div class="absolute inset-0 bg-brand-gold translate-x-[-101%] group-hover:translate-x-0 transition-transform duration-500 ease-out z-0"></div>
                
                <div class="relative z-10 flex justify-between items-center">
                    <span class="text-xl tracking-[0.2em] text-brand-gold group-hover:text-black font-extrabold uppercase transition-colors duration-300">
                        Elitestyle Gang
                    </span>
                    <i class="fa-solid fa-users text-2xl text-brand-gold group-hover:text-black transition-colors duration-300 drop-shadow-md"></i>
                </div>
            </a>
            
        </div>
    </main>

    <script>
        // สร้างระบบเอฟเฟกต์รูป winter.png โปรยปรายขนาดเล็ก
        const winterContainer = document.getElementById('winterContainer');
        const winterCount = 18; // จำนวนรูป winter.png ที่โปรยพร้อมกัน

        for (let i = 0; i < winterCount; i++) {
            let item = document.createElement('img');
            item.src = 'winter.png';
            item.classList.add('winter-particle');
            
            // สุ่มขนาดให้เล็กกำลังพอดี (เช่น 20px ถึง 40px)
            let size = Math.random() * 20 + 20;
            item.style.width = size + 'px';
            
            // สุ่มตำแหน่งเริ่มต้นแนวนอน
            item.style.left = Math.random() * 100 + 'vw';
            
            // สุ่มความเร็วในการตก
            let duration = Math.random() * 12 + 8;
            item.style.animationDuration = duration + 's';
            
            // สุ่มเวลาดีเลย์
            let delay = Math.random() * 10;
            item.style.animationDelay = delay + 's';
            
            // สุ่มระยะการเอียงซ้ายขวาขณะตก
            let drift = (Math.random() - 0.5) * 120 + 'px';
            item.style.setProperty('--winter-drift', drift);
            
            // สุ่มความโปร่งใสให้ดูสบายตา ไม่ทึบเกินไป
            let opacity = Math.random() * 0.5 + 0.3;
            item.style.opacity = opacity;

            winterContainer.appendChild(item);
        }
    </script>
</body>
</html>
